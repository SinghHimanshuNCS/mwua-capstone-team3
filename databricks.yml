bundle:
  name: mwua-capstone-team3

variables:
  catalog:
    default: mwua_capstone_team3
  schema:
    default: default

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: mwua_capstone_team3
      schema: default
    workspace:
      host: https://dbc-d8b9acd9-b19b.cloud.databricks.com

  # prod:
  #   mode: production
  #   variables:
  #     catalog: mwua_team3_prod
  #     schema: default
  #   workspace:
  #     host: https://dbc-d8b9acd9-b19b.cloud.databricks.com/

resources:
  pipelines:
    billing_customer_pipeline:
      name: billing_customer_pipeline
      catalog: ${var.catalog}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ./uc1_billing_operations/billing_customer_pipeline/transformations/Bronze.py
        - file:
            path: ./uc1_billing_operations/billing_customer_pipeline/transformations/Silver.py
        - file:
            path: ./uc1_billing_operations/billing_customer_pipeline/transformations/Gold.py

    finance_corporation_pipeline:
      name: finance_corporation_pipeline
      catalog: ${var.catalog}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ./uc2_finance_corporation/finance_corporation_pipeline/transformations/Bronze.py
        - file:
            path: ./uc2_finance_corporation/finance_corporation_pipeline/transformations/Silver.py
        - file:
            path: ./uc2_finance_corporation/finance_corporation_pipeline/transformations/Gold.py

    network_sensor_pipeline:
      name: network_sensor_pipeline
      catalog: ${var.catalog}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ./uc3_network_sensors/network_sensor_pipeline/transformations/Bronze.py
        - file:
            path: ./uc3_network_sensors/network_sensor_pipeline/transformations/Silver.py
        - file:
            path: ./uc3_network_sensors/network_sensor_pipeline/transformations/Gold.py
    
  jobs:
    governance_setup_job:
      name: governance_setup_job
      tasks:
        - task_key: apply_governance
          sql_task:
            file:
              path: ./governance_setup.sql
            warehouse_id: 1c774ae413eb3427

  
    mwua_orchestration_job:
      name: mwua_orchestration_job
      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # har ghante ki shuruaat mein — apni zaroorat ke hisaab se badlo
        timezone_id: "Asia/Singapore"
        pause_status: UNPAUSED

      tasks:
        - task_key: run_usecase1
          pipeline_task:
            pipeline_id: ${resources.pipelines.billing_customer_pipeline.id}

        - task_key: run_usecase2
          pipeline_task:
            pipeline_id: ${resources.pipelines.finance_corporation_pipeline.id}

        - task_key: run_usecase3
          pipeline_task:
            pipeline_id: ${resources.pipelines.network_sensor_pipeline.id}

        - task_key: build_shared_tables
          depends_on:
            - task_key: run_usecase1
            - task_key: run_usecase2
            - task_key: run_usecase3
          sql_task:
            file:
              path: ./orchestration/build_shared_tables.sql
            warehouse_id: 1c774ae413eb3427